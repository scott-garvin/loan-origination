services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: origin
    ports: ["127.0.0.1:5447:5432"]
    volumes: ["origin-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origin"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["127.0.0.1:8087:8087"]
    environment:
      DATABASE_URL: postgresql://origin:local-demo-only@db:5432/origin
      DEMO_ACCESS_KEY: ${DEMO_ACCESS_KEY:-local-origin-demo-key-only}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      NODE_ENV: development
      PORT: 8087
    depends_on:
      db:
        condition: service_healthy
volumes:
  origin-data:
